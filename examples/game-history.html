<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Synthetic Game History</title>
<h1>Synthetic Game History</h1>
<app-game-rush-and-cash>
  <app-download-button-game-session-hand>
    <button class="btn btn-download btn-red" type="button" disabled>Download</button>
  </app-download-button-game-session-hand>
  <app-sessions>
    <section class="table-wrapper">
      <table>
        <thead><tr><th></th><th>Session Start Time</th></tr></thead>
        <tbody>
          <tr class="mat-mdc-row">
            <td class="mat-column-Checkbox"><input type="checkbox" checked></td><td>Example session</td>
          </tr>
        </tbody>
      </table>
    </section>
  </app-sessions>
  <app-game-session-detail>
    <nav><button type="button" kind="Hands" active="true">Game History</button></nav>
    <div class="session-detail">
      <app-game-session-detail-hands>
        <div class="table-container" progress="false">
          <table class="mat-sort table table-hover">
            <thead>
              <tr><th>Date</th><th></th><th>Hand ID</th><th>Hole Card</th><th>Hand Value</th><th>Winner</th><th>Pot</th><th>Winloss</th></tr>
            </thead>
            <tbody>
              <tr><td></td><td></td><td>VH900000001</td><td></td><td></td><td>Example Alice</td><td></td><td></td></tr>
              <tr><td></td><td></td><td>HD900000003</td><td></td><td></td><td>Example Casey</td><td></td><td></td></tr>
              <tr hidden><td></td><td></td><td>HD900000004</td><td></td><td></td><td>Hidden player</td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination">
          <button type="button" btn-transparent disabled><i class="fa fa-angle-left"></i></button>
          <span class="current-page">1</span>
          <button type="button" btn-transparent disabled><i class="fa fa-angle-right"></i></button>
          <button type="button" btn-transparent aria-haspopup="menu" aria-expanded="false">10 Rows</button>
        </div>
      </app-game-session-detail-hands>
    </div>
  </app-game-session-detail>
</app-game-rush-and-cash>
</html>
