<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokerCraft Winner Capture</title>
  <style>
    body { font: 14px system-ui, sans-serif; min-width: 340px; margin: 16px; }
    h1 { font-size: 17px; margin: 0 0 12px; }
    button { margin: 3px 5px 3px 0; padding: 5px 9px; }
    p:empty { display: none; }
  </style>
</head>
<body>
  <h1>PokerCraft Winner Capture</h1>
  <p id="selection" aria-live="polite"></p>
  <button id="history" type="button" disabled>Open Game History</button>
  <button id="capture" type="button" disabled>Capture &amp; download CSV</button>
  <button id="download" type="button" disabled>Download hand histories</button>
  <p id="status" role="status"></p>
  <p id="count" aria-live="polite"></p>
  <button id="export" type="button" hidden>Download saved CSV</button>
  <script src="pokercraft.js"></script>
  <script src="popup.js"></script>
</body>
</html>
